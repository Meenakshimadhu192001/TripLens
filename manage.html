<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripLens — Package Manager</title>
  <link rel="stylesheet" href="/design-system.css?v=2026-09-24-4"><link rel="stylesheet" href="/styles.css?v=2026-09-24-4">
</head>
<body><main class="main-content manager-page" style="max-width:1000px;margin:2rem auto;padding:0 1rem">
  <a href="/" class="btn-secondary">← Back to TripLens</a>
  <div class="screen-title-group"><h1 class="screen-title">Package manager</h1><p class="screen-subtitle">Every field below is required to keep package data complete and transparent.</p></div>
  <section id="packager-login" class="pref-card manager-login-card manager-panel" style="margin-top:1rem">
    <h2 class="screen-title" style="font-size:1.25rem">Packager sign in</h2>
    <form id="packager-login-form" class="manager-login-form">
      <div class="form-group"><label class="form-label" for="packager-email">Email</label><input class="form-select" id="packager-email" type="email" value="agency@mystikal.com" autocomplete="username" required></div>
      <div class="form-group"><label class="form-label" for="packager-password">Password</label><input class="form-select" id="packager-password" type="password" value="packager123" autocomplete="current-password" required></div>
      <p id="login-message" aria-live="polite"></p><button class="btn-primary-cta" type="submit"><span>Sign in</span><span>→</span></button>
      <div class="google-sign-in-divider">or</div>
      <button type="button" class="google-sign-in-button" id="google-packager-sign-in">Continue with Google</button>
    </form>
  </section>
  <section id="manager-shell" class="manager-shell" hidden>
    <div class="manager-toolbar manager-panel"><div id="logged-in-as"></div><button class="btn-secondary" type="button" id="packager-logout">Sign out</button></div>
  <form id="package-form" class="pref-card manager-form-panel" style="margin-top:1rem">
    <div class="manager-section-block">
      <h2 class="screen-title manager-section-title">1. Core package details</h2>
      <div class="pref-grid" id="core-fields"></div>
    </div>
    <div class="manager-section-block">
      <h2 class="screen-title manager-section-title">2. Day-wise itinerary</h2>
      <div id="itinerary-fields"></div>
      <button class="btn-secondary" type="button" id="add-day" style="margin-top:0.75rem">+ Add day</button>
    </div>
    <div class="manager-section-block">
      <h2 class="screen-title manager-section-title">3. Stays & logistics</h2>
      <div id="accommodation-fields"></div><button class="btn-secondary" type="button" id="add-stay">+ Add stay</button>
    </div>
    <div class="manager-section-block">
      <h2 class="screen-title manager-section-title">4. Transparency & policy</h2>
      <label class="form-label">Inclusions — one item per line</label><textarea class="ai-prompt-textarea" id="inclusions" required rows="4" placeholder="Entry tickets&#10;Toll and parking"></textarea>
      <label class="form-label" style="margin-top:1rem">Exclusions — one item per line</label><textarea class="ai-prompt-textarea" id="exclusions" required rows="4" placeholder="Personal expenses&#10;Safari permits"></textarea>
    </div>
    <p id="form-message" aria-live="polite" style="margin-top:1rem"></p><button class="btn-primary-cta" type="submit"><span>Save complete package</span><span>→</span></button>
  </form>
  </section>
</main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="/manage.js?v=2026-09-24-4"></script></body></html>
